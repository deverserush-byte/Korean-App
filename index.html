<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Dictation App</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #2c3e50;
      --border: #e1e8ed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: #f8f9fa;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-secondary { background: #95a5a6; color: white; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .feedback.correct {
      background: #e8f8f5;
      color: var(--success);
      display: block;
    }

    .feedback.incorrect {
      background: #fadbd8;
      color: var(--danger);
      display: block;
    }

    .word-list {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .word-item button {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .word-item button.restore-btn {
      background: var(--primary);
      margin-left: 5px;
    }

    .audio-controls {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .play-sound-btn {
      background: #8e44ad;
      color: white;
      border: none;
      border-radius: 50%;
      width: 64px;
      height: 64px;
      font-size: 24px;
      cursor: pointer;
    }

    #memorize-btn {
      display: none;
      background: #f39c12;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('practice')">Practice</button>
    <button class="tab-btn" onclick="switchTab('manage')">Words</button>
    <button class="tab-btn" onclick="switchTab('memorized')">🧠 Memorized</button>
  </div>

  <!-- PRACTICE TAB -->
  <div id="tab-practice" class="section active">
    <h1>Dictation Practice</h1>
    <div class="audio-controls">
      <button class="play-sound-btn" onclick="playAudio()">🔊</button>
    </div>
    <input type="text" id="user-input" placeholder="Type what you hear..." autocomplete="off">
    <button class="btn btn-primary" onclick="checkAnswer()">Check Answer</button>

    <div id="feedback" class="feedback"></div>
    <button id="memorize-btn" class="btn" onclick="markAsMemorized()">🧠 Mark as Memorized</button>
    <button id="next-btn" class="btn btn-secondary" style="display:none; margin-top: 8px;" onclick="nextWord()">Next Word ➔</button>
  </div>

  <!-- MANAGE WORDS TAB -->
  <div id="tab-manage" class="section">
    <h2>Active Word Bank</h2>
    <input type="text" id="new-word" placeholder="Add Korean word...">
    <button class="btn btn-success" onclick="addWord()">Add Word</button>
    <ul id="active-list" class="word-list"></ul>
  </div>

  <!-- MEMORIZED TAB -->
  <div id="tab-memorized" class="section">
    <h2>Memorized Folder</h2>
    <p style="font-size:0.9em; color:#666; text-align:center;">Words here won't show up in practice tests.</p>
    <ul id="memorized-list" class="word-list"></ul>
  </div>
</div>

<script>
  let activeWords = JSON.parse(localStorage.getItem('korean_words')) || ['안녕하세요', '감사합니다', '한국어'];
  let memorizedWords = JSON.parse(localStorage.getItem('korean_memorized')) || [];
  let currentWordIndex = 0;

  function saveData() {
    localStorage.setItem('korean_words', JSON.stringify(activeWords));
    localStorage.setItem('korean_memorized', JSON.stringify(memorizedWords));
    renderLists();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    
    if (tab === 'practice') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-practice').classList.add('active');
      nextWord();
    } else if (tab === 'manage') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-manage').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-memorized').classList.add('active');
    }
  }

  function playAudio() {
    if (activeWords.length === 0) return;
    const word = activeWords[currentWordIndex];
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'ko-KR';
    window.speechSynthesis.speak(utterance);
  }

  function checkAnswer() {
    if (activeWords.length === 0) return;
    const input = document.getElementById('user-input').value.trim();
    const correct = activeWords[currentWordIndex];
    const feedback = document.getElementById('feedback');
    const memorizeBtn = document.getElementById('memorize-btn');
    const nextBtn = document.getElementById('next-btn');

    if (input === correct) {
      feedback.className = "feedback correct";
      feedback.innerText = "✨ Correct! Fantastic job!";
      memorizeBtn.style.display = "block";
      nextBtn.style.display = "block";
    } else {
      feedback.className = "feedback incorrect";
      feedback.innerText = `❌ Not quite. Correct word: ${correct}`;
      memorizeBtn.style.display = "none";
      nextBtn.style.display = "block";
    }
  }

  function markAsMemorized() {
    if (activeWords.length === 0) return;
    const word = activeWords[currentWordIndex];
    memorizedWords.push(word);
    activeWords.splice(currentWordIndex, 1);
    saveData();
    nextWord();
  }

  function nextWord() {
    document.getElementById('user-input').value = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('memorize-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    if (activeWords.length === 0) {
      document.getElementById('feedback').className = "feedback correct";
      document.getElementById('feedback').innerText = "🎉 You've memorized or practiced all words!";
      document.getElementById('feedback').style.display = 'block';
      return;
    }

    currentWordIndex = Math.floor(Math.random() * activeWords.length);
    playAudio();
  }

  function addWord() {
    const input = document.getElementById('new-word');
    const word = input.value.trim();
    if (word) {
      activeWords.push(word);
      input.value = '';
      saveData();
    }
  }

  function deleteWord(index) {
    activeWords.splice(index, 1);
    saveData();
  }

  function restoreWord(index) {
    const word = memorizedWords.splice(index, 1)[0];
    activeWords.push(word);
    saveData();
  }

  function renderLists() {
    const activeList = document.getElementById('active-list');
    activeList.innerHTML = '';
    activeWords.forEach((word, index) => {
      activeList.innerHTML += `<li class="word-item"><span>${word}</span><button onclick="deleteWord(${index})">Delete</button></li>`;
    });

    const memorizedList = document.getElementById('memorized-list');
    memorizedList.innerHTML = '';
    memorizedWords.forEach((word, index) => {
      memorizedList.innerHTML += `<li class="word-item"><span>${word}</span><button class="restore-btn" onclick="restoreWord(${index})">Unmemorize</button></li>`;
    });
  }

  // Initial setup
  saveData();
  nextWord();
</script>

</body>
</html>
