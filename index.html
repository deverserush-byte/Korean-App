<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korean Vocabulary Dictation App</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --success-color: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 60%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Auth Header */
    .auth-header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .auth-info {
      display: flex;
      flex-direction: column;
    }

    .auth-user {
      font-weight: 700;
      font-size: 14px;
    }

    .sync-status {
      font-size: 11px;
      color: var(--subtext-color);
    }

    .auth-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .auth-btn.logout {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--subtext-color);
      box-shadow: none;
    }

    /* Tabs Bar */
    .nav-tabs {
      display: flex;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid var(--card-border);
    }

    .nav-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--subtext-color);
      padding: 10px 0;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-tab-btn.active {
      background: var(--accent-color);
      color: white;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    /* Card Box */
    .card-display {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      padding: 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 200px;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: var(--subtext-color);
      font-weight: 500;
    }

    .word-main {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .word-hint {
      font-size: 15px;
      color: var(--subtext-color);
      min-height: 24px;
      font-weight: 500;
    }

    /* Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .ctrl-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      grid-column: span 2;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .ctrl-btn.success {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      grid-column: span 2;
      box-shadow: 0 4px 14px var(--success-glow);
    }

    /* Segmented Controllers */
    .segmented-control {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--card-border);
      gap: 4px;
      overflow-x: auto;
    }

    .segmented-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--subtext-color);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .segmented-btn.active {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
    }

    /* Settings & Input Box */
    .panel-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--subtext-color);
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      margin-top: 6px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .action-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Folders / Accordions */
    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .custom-word-item, .history-word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid var(--card-border);
    }

    .custom-word-kor, .history-word-kor { font-weight: 700; }
    .custom-word-eng, .history-word-eng { color: var(--subtext-color); font-size: 12px; margin-left: 6px; }

    .action-btn-group { display: flex; gap: 4px; }
    .edit-btn, .delete-btn, .restore-btn, .history-speak-btn, .copy-btn {
      background: transparent;
      border: none;
      color: var(--subtext-color);
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .edit-btn:hover { color: var(--accent-color); }
    .delete-btn:hover { color: var(--danger-color); }
    .restore-btn:hover { color: var(--success-color); }

    .copy-btn {
      background: var(--card-border);
      color: var(--text-color);
    }

    .date-group-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 14px;
      margin-bottom: 12px;
    }

    .date-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .date-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .date-group-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hidden { display: none !important; }
    .empty-list-text { font-size: 12px; color: var(--subtext-color); text-align: center; padding: 12px; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Auth Bar -->
    <div class="auth-header">
      <div class="auth-info">
        <span class="auth-user" id="authUserInfo">☁️ Guest Mode (Local Only)</span>
        <span class="sync-status" id="syncStatus">Sign in to sync across devices</span>
      </div>
      <button class="auth-btn" id="authBtn" onclick="handleAuthAction()">Sign In</button>
    </div>

    <!-- Main Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-tab-btn active" id="tabPracticeBtn" onclick="switchTab('practice')">Dictation Practice</button>
      <button class="nav-tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">History & Dates</button>
    </div>

    <!-- PRACTICE TAB CONTENT -->
    <div id="practiceTab">
      
      <!-- Card Display -->
      <div class="card-display">
        <div class="card-meta">
          <span id="cardIndexLabel">Card: 0 / 0</span>
          <span id="streakBadge">🔥 0 Days (🛡️ 2/2)</span>
          <span id="flowLabel">0% Done</span>
        </div>
        <div class="word-main" id="displayWord">????</div>
        <div class="word-hint" id="displayHint">[ Listen to audio ]</div>
      </div>

      <!-- Controls -->
      <div class="controls-grid" style="margin-top: 12px;">
        <button class="ctrl-btn" id="prevBtn">◀ Prev</button>
        <button class="ctrl-btn" id="togglePlayBtn">❚❚</button>
        <button class="ctrl-btn" id="repeatBtn">🔊 Repeat</button>
        <button class="ctrl-btn" id="nextBtn">Next ▶</button>
        <button class="ctrl-btn primary" id="checkBtn">👁️ Show / Hide Answer</button>
        <button class="ctrl-btn success" id="memorizeCurrentBtn">🧠 Mark Memorized</button>
      </div>

      <!-- Settings & Mode Selection -->
      <div class="panel-box" style="margin-top: 12px;">
        <div>
          <span style="font-size: 11px; color: var(--subtext-color); font-weight: 700; letter-spacing: 0.5px;">SELECT DECK</span>
          <div class="segmented-control" id="deckSelector" style="margin-top: 6px;">
            <button class="segmented-btn active" data-deck="essential">Essential</button>
            <button class="segmented-btn" data-deck="verbs">Verbs</button>
            <button class="segmented-btn" data-deck="travel">Travel</button>
            <button class="segmented-btn" id="customDeckBtn" data-deck="custom">Custom (0)</button>
            <button class="segmented-btn" id="memorizedDeckBtn" data-deck="memorized">🧠 Memorized (0)</button>
          </div>
        </div>

        <div>
          <span style="font-size: 11px; color: var(--subtext-color); font-weight: 700; letter-spacing: 0.5px;">ORDER MODE</span>
          <div class="segmented-control" id="orderSelector" style="margin-top: 6px;">
            <button class="segmented-btn active" data-order="random">Random Loop</button>
            <button class="segmented-btn" data-order="sequential">Sequential</button>
          </div>
        </div>

        <div>
          <div class="slider-row">
            <span>Audio Interval Delay</span>
            <span id="delayValText">5 seconds</span>
          </div>
          <input type="range" id="delaySlider" min="2" max="15" value="5" />
        </div>
      </div>

      <!-- Add Custom Word Section -->
      <div class="panel-box" style="margin-top: 12px;">
        <span style="font-size: 12px; font-weight: 700;">➕ Add Custom Word</span>
        <div class="input-group">
          <input type="text" id="customKorean" placeholder="Korean (e.g. 사과)" />
          <button class="action-btn" id="autoTranslateBtn" style="background: var(--card-border);">✨ Auto Translate</button>
        </div>
        <div class="input-group">
          <input type="text" id="customEnglish" placeholder="English (e.g. Apple)" />
          <button class="action-btn" id="addWordBtn">Save Word</button>
        </div>
      </div>

      <!-- Custom Saved Accordion -->
      <div class="panel-box" style="margin-top: 12px;">
        <div class="folder-header" id="folderToggleBtn">
          <span id="folderTitleText">📁 Saved Custom Words (0)</span>
          <span id="folderArrow">▼</span>
        </div>
        <div class="word-list hidden" id="customWordListContainer"></div>
      </div>

      <!-- Memorized Saved Accordion -->
      <div class="panel-box" style="margin-top: 12px;">
        <div class="folder-header" id="memorizedToggleBtn">
          <span id="memorizedTitleText">🧠 Memorized Words (0)</span>
          <span id="memorizedArrow">▼</span>
        </div>
        <div class="word-list hidden" id="memorizedWordListContainer"></div>
      </div>

      <!-- Stats Bar -->
      <div class="panel-box" style="margin-top: 12px; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 12px; color: var(--subtext-color);">Daily Goal Progress:</span>
        <span id="dailyGoalCount" style="font-size: 13px; font-weight: 700;">0 / 10</span>
        <span id="intervalLabel" style="font-size: 11px; color: var(--subtext-color);">Interval: 5s</span>
      </div>

    </div>

    <!-- HISTORY TAB CONTENT -->
    <div id="historyTab" class="hidden">
      <div id="dateHistoryContainer"></div>
    </div>

  </div>

  <!-- SCRIPT IMPLEMENTATION -->
  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyAvBZnLDplFvufjtTU66-rW5Spb9QW6bs0",
      authDomain: "koreanvocabapp-cd32c.firebaseapp.com",
      projectId: "koreanvocabapp-cd32c",
      storageBucket: "koreanvocabapp-cd32c.firebasestorage.app",
      messagingSenderId: "328663899339",
      appId: "1:328663899339:web:427a0d8598e6024509cf4e"
    };

    let currentUser = null;
    let db = null;
    let auth = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();

      auth.getRedirectResult().then((result) => {
        if (result && result.user) {
          console.log("Logged in via redirect:", result.user.email);
        }
      }).catch((error) => {
        if (error.code && error.code !== 'auth/popup-closed-by-user') {
          alert("Login Redirect Error: " + error.message);
        }
      });

      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          document.getElementById("authUserInfo").innerText = `👤 ${user.displayName || user.email}`;
          document.getElementById("syncStatus").innerText = "⚡ Connected & Cloud Synced";
          document.getElementById("authBtn").innerText = "Sign Out";
          document.getElementById("authBtn").classList.add("logout");
          loadCloudData(user.uid);
        } else {
          currentUser = null;
          document.getElementById("authUserInfo").innerText = "☁️ Guest Mode (Local Only)";
          document.getElementById("syncStatus").innerText = "Sign in to sync across devices";
          document.getElementById("authBtn").innerText = "Sign In";
          document.getElementById("authBtn").classList.remove("logout");
        }
      });
    } catch (e) {
      console.warn("Firebase initialization error:", e);
    }

    function handleAuthAction() {
      if (!auth) {
        alert("Firebase Auth is not properly initialized.");
        return;
      }
      if (currentUser) {
        auth.signOut().then(() => {
          alert("Signed out successfully.");
        }).catch(err => alert("Sign out error: " + err.message));
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        auth.signInWithPopup(provider).catch((error) => {
          if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
            auth.signInWithRedirect(provider);
          } else {
            alert("Sign-in error: " + error.message);
          }
        });
      }
    }

    // --- ENHANCED & STABLE SPEECH ENGINE ---
    let selectedKoreanVoice = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        // Priority to clear, natural/neural Google or Apple Korean voices
        selectedKoreanVoice = voices.find(v => (v.lang === 'ko-KR' || v.lang === 'ko_KR') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Yuna') || v.name.includes('Seoyeon'))) ||
                              voices.find(v => v.lang === 'ko-KR' || v.lang === 'ko_KR') || null;
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakKorean(text) {
      if (!('speechSynthesis' in window)) return;

      // Reset speech engine state to clear stalls/hanging
      window.speechSynthesis.cancel();

      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.85; // Slightly slower for accurate dictation
        utterance.pitch = 1.0;

        if (selectedKoreanVoice) {
          utterance.voice = selectedKoreanVoice;
        }

        window.speechSynthesis.speak(utterance);
        recordWordSpoken();
      }, 50);
    }

    // --- APP CORE DATA & LOGIC ---
    const decks = {
      essential: [
        { korean: "안녕하세요", english: "Hello" },
        { korean: "감사합니다", english: "Thank you" },
        { korean: "네", english: "Yes" },
        { korean: "아니요", english: "No" },
        { korean: "죄송합니다", english: "Sorry" }
      ],
      verbs: [
        { korean: "가다", english: "To go" },
        { korean: "오다", english: "To come" },
        { korean: "먹다", english: "To eat" },
        { korean: "마시다", english: "To drink" },
        { korean: "자다", english: "To sleep" }
      ],
      travel: [
        { korean: "공항", english: "Airport" },
        { korean: "호텔", english: "Hotel" },
        { korean: "여권", english: "Passport" },
        { korean: "택시", english: "Taxi" },
        { korean: "지도", english: "Map" }
      ],
      custom: [],
      memorized: []
    };

    let currentDeckKey = "essential";
    let activeList = [...decks.essential];
    let currentIndex = 0;
    let spokenCountToday = 0;
    let currentStreak = 0;
    let availableRestorations = 2;
    let lastWeekNumber = 0;
    let goalReachedToday = false;
    let isPlaying = true;
    let orderMode = "random";
    let delaySeconds = 5;
    let timer = null;
    let answerRevealed = false;
    let isFolderOpen = false;
    let isMemorizedFolderOpen = false;
    let dateCollapseState = {};

    const displayWord = document.getElementById("displayWord");
    const displayHint = document.getElementById("displayHint");
    const cardIndexLabel = document.getElementById("cardIndexLabel");
    const intervalLabel = document.getElementById("intervalLabel");
    const dailyGoalCountEl = document.getElementById("dailyGoalCount");
    const streakBadge = document.getElementById("streakBadge");
    const flowLabel = document.getElementById("flowLabel");
    const delaySlider = document.getElementById("delaySlider");
    const delayValText = document.getElementById("delayValText");
    const customDeckBtn = document.getElementById("customDeckBtn");
    const memorizedDeckBtn = document.getElementById("memorizedDeckBtn");
    const customWordListContainer = document.getElementById("customWordListContainer");
    const memorizedWordListContainer = document.getElementById("memorizedWordListContainer");
    const folderToggleBtn = document.getElementById("folderToggleBtn");
    const folderTitleText = document.getElementById("folderTitleText");
    const folderArrow = document.getElementById("folderArrow");
    const memorizedToggleBtn = document.getElementById("memorizedToggleBtn");
    const memorizedTitleText = document.getElementById("memorizedTitleText");
    const memorizedArrow = document.getElementById("memorizedArrow");

    window.switchTab = function(tabName) {
      const practiceTab = document.getElementById("practiceTab");
      const historyTab = document.getElementById("historyTab");
      const tabPracticeBtn = document.getElementById("tabPracticeBtn");
      const tabHistoryBtn = document.getElementById("tabHistoryBtn");

      if (tabName === 'practice') {
        practiceTab.classList.remove("hidden");
        historyTab.classList.add("hidden");
        tabPracticeBtn.classList.add("active");
        tabHistoryBtn.classList.remove("active");
      } else {
        practiceTab.classList.add("hidden");
        historyTab.classList.remove("hidden");
        tabPracticeBtn.classList.remove("active");
        tabHistoryBtn.classList.add("active");
        renderDateHistoryTab();
      }
    };

    function getDisplayDateString(dateObj = new Date()) {
      return dateObj.toLocaleDateString("en-US", { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function generateId() {
      return 'id_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    }

    function saveWordsToStorage() {
      localStorage.setItem("korean_custom_words", JSON.stringify(decks.custom));
      localStorage.setItem("korean_memorized_words", JSON.stringify(decks.memorized));
      syncToCloud();
    }

    function syncToCloud() {
      if (currentUser && db) {
        document.getElementById("syncStatus").innerText = "⏳ Syncing...";
        const userDocRef = db.collection("vocab_users").doc(currentUser.uid);
        userDocRef.set({
          custom: decks.custom,
          memorized: decks.memorized,
          streak: currentStreak,
          spokenCountToday: spokenCountToday,
          lastDate: getTodayDate().toISOString(),
          goalReachedToday: goalReachedToday,
          availableRestorations: availableRestorations,
          lastWeekNumber: lastWeekNumber
        }, { merge: true }).then(() => {
          document.getElementById("syncStatus").innerText = "⚡ Connected & Cloud Synced";
        }).catch(err => {
          document.getElementById("syncStatus").innerText = "⚠️ Sync Error";
        });
      }
    }

    function loadCloudData(uid) {
      if (!db) return;
      document.getElementById("syncStatus").innerText = "⏳ Fetching progress...";
      db.collection("vocab_users").doc(uid).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (data.custom) decks.custom = data.custom;
          if (data.memorized) decks.memorized = data.memorized;
          if (data.streak !== undefined) currentStreak = data.streak;
          if (data.spokenCountToday !== undefined) spokenCountToday = data.spokenCountToday;
          if (data.goalReachedToday !== undefined) goalReachedToday = data.goalReachedToday;
          if (data.availableRestorations !== undefined) availableRestorations = data.availableRestorations;
          if (data.lastWeekNumber !== undefined) lastWeekNumber = data.lastWeekNumber;

          saveWordsToStorage();
          updateStreakUI();
          renderCustomList();
          updateCardDisplay();
        } else {
          syncToCloud();
        }
        document.getElementById("syncStatus").innerText = "⚡ Connected & Cloud Synced";
      });
    }

    function loadSavedWords() {
      const storedCustom = localStorage.getItem("korean_custom_words");
      if (storedCustom) {
        try { 
          decks.custom = JSON.parse(storedCustom); 
          decks.custom.forEach(item => {
            if (!item.addedDate) item.addedDate = getDisplayDateString();
            if (!item.id) item.id = generateId();
          });
        } catch (e) { decks.custom = []; }
      }

      const storedMemorized = localStorage.getItem("korean_memorized_words");
      if (storedMemorized) {
        try { 
          decks.memorized = JSON.parse(storedMemorized);
          decks.memorized.forEach(item => {
            if (!item.addedDate) item.addedDate = getDisplayDateString();
            if (!item.id) item.id = generateId();
          });
        } catch (e) { decks.memorized = []; }
      }
    }

    function getTodayDate() {
      const today = new Date();
      return new Date(today.getFullYear(), today.getMonth(), today.getDate());
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    }

    function loadStreakData() {
      const today = getTodayDate();
      const currentWeek = getWeekNumber(today);
      const savedDateStr = localStorage.getItem("korean_last_date");
      const savedStreak = parseInt(localStorage.getItem("korean_streak") || "0");
      const savedCount = parseInt(localStorage.getItem("korean_words_today") || "0");
      const savedGoal = localStorage.getItem("korean_goal_reached") === "true";
      let savedRestorations = parseInt(localStorage.getItem("korean_restorations") || "2");
      let savedWeek = parseInt(localStorage.getItem("korean_last_week") || "0");

      if (savedWeek !== currentWeek) {
        savedRestorations = 2;
        lastWeekNumber = currentWeek;
      } else {
        lastWeekNumber = savedWeek;
      }
      availableRestorations = savedRestorations;

      if (savedDateStr) {
        const lastDate = new Date(savedDateStr);
        const diffTime = Math.abs(today - lastDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
          spokenCountToday = savedCount;
          currentStreak = savedStreak;
          goalReachedToday = savedGoal;
        } else if (diffDays === 1) {
          spokenCountToday = 0;
          currentStreak = savedStreak;
          goalReachedToday = false;
        } else {
          const missedDays = diffDays - 1;
          if (availableRestorations >= missedDays && savedStreak > 0) {
            availableRestorations -= missedDays;
            currentStreak = savedStreak;
            alert(`🛡️ Streak Protection Activated!\nYou missed ${missedDays} day(s), but your streak was saved!`);
          } else {
            currentStreak = 0;
          }
          spokenCountToday = 0;
          goalReachedToday = false;
        }
      } else {
        spokenCountToday = 0;
        currentStreak = 0;
        goalReachedToday = false;
      }

      saveStreakData();
      updateStreakUI();
    }

    function saveStreakData() {
      const todayStr = getTodayDate().toISOString();
      localStorage.setItem("korean_last_date", todayStr);
      localStorage.setItem("korean_streak", currentStreak.toString());
      localStorage.setItem("korean_words_today", spokenCountToday.toString());
      localStorage.setItem("korean_goal_reached", goalReachedToday.toString());
      localStorage.setItem("korean_restorations", availableRestorations.toString());
      localStorage.setItem("korean_last_week", lastWeekNumber.toString());
      syncToCloud();
    }

    function updateStreakUI() {
      streakBadge.innerText = `🔥 ${currentStreak} Day${currentStreak === 1 ? '' : 's'} (🛡️ ${availableRestorations}/2)`;
      dailyGoalCountEl.innerText = `${spokenCountToday} / 10`;
    }

    function recordWordSpoken() {
      spokenCountToday++;
      if (spokenCountToday >= 10 && !goalReachedToday) {
        goalReachedToday = true;
        currentStreak++;
        alert(`🎉 Streak Kept Alive!\n🔥 Streak: ${currentStreak} Day(s)`);
      }
      saveStreakData();
      updateStreakUI();
    }

    function updateCardDisplay() {
      answerRevealed = false;
      displayWord.innerText = "????";
      displayHint.innerText = "[ Listen to audio ]";

      if (activeList.length === 0) {
        cardIndexLabel.innerText = "Card: 0 / 0";
        flowLabel.innerText = "100% Done";
        displayWord.innerText = "Empty";
        displayHint.innerText = "[ No words in this deck ]";
        return;
      }

      cardIndexLabel.innerText = `Card: ${currentIndex + 1} / ${activeList.length}`;
      const pct = Math.round(((currentIndex + 1) / activeList.length) * 100);
      flowLabel.innerText = `${pct}% Done`;

      if (isPlaying && activeList.length > 0) {
        speakKorean(activeList[currentIndex].korean);
      }
    }

    function renderCustomList() {
      const customCount = decks.custom.length;
      const memorizedCount = decks.memorized.length;

      customDeckBtn.innerText = `Custom (${customCount})`;
      memorizedDeckBtn.innerText = `🧠 Memorized (${memorizedCount})`;

      folderTitleText.innerText = `📁 Saved Custom Words (${customCount})`;
      memorizedTitleText.innerText = `🧠 Memorized Words (${memorizedCount})`;

      if (customCount === 0) {
        customWordListContainer.innerHTML = `<div class="empty-list-text">No custom words added yet.</div>`;
      } else {
        customWordListContainer.innerHTML = decks.custom.map((item) => `
          <div class="custom-word-item">
            <div>
              <span class="custom-word-kor">${item.korean}</span>
              <span class="custom-word-eng">- ${item.english}</span>
            </div>
            <div class="action-btn-group">
              <button class="edit-btn" data-action="edit" data-id="${item.id}">Edit</button>
              <button class="delete-btn" data-action="delete" data-id="${item.id}">Delete</button>
            </div>
          </div>
        `).join("");
      }

      if (memorizedCount === 0) {
        memorizedWordListContainer.innerHTML = `<div class="empty-list-text">No memorized words saved yet.</div>`;
      } else {
        memorizedWordListContainer.innerHTML = decks.memorized.map((item) => `
          <div class="custom-word-item">
            <div>
              <span class="custom-word-kor">${item.korean}</span>
              <span class="custom-word-eng">- ${item.english}</span>
            </div>
            <button class="restore-btn" data-action="unmemorize" data-id="${item.id}">Unmemorize</button>
          </div>
        `).join("");
      }
    }

    function renderDateHistoryTab() {
      const container = document.getElementById("dateHistoryContainer");
      const allWords = [...decks.custom, ...decks.memorized];

      if (allWords.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px; font-size:12px;">No custom words added yet. Add words in the Dictation tab to see them logged here!</div>`;
        return;
      }

      const groupedByDate = {};
      allWords.forEach(word => {
        const dateKey = word.addedDate || getDisplayDateString();
        if (!groupedByDate[dateKey]) groupedByDate[dateKey] = [];
        groupedByDate[dateKey].push(word);
      });

      const todayStr = getDisplayDateString();
      if (dateCollapseState[todayStr] === undefined) dateCollapseState[todayStr] = true;

      let html = "";
      Object.keys(groupedByDate).forEach(date => {
        const isExpanded = !!dateCollapseState[date];
        const wordsInDate = groupedByDate[date];

        html += `
          <div class="date-group-card">
            <div class="date-group-header">
              <div class="date-title-group" data-action="toggle-date" data-date="${date}">
                <span>📅 ${date} (${wordsInDate.length} word${wordsInDate.length === 1 ? '' : 's'})</span>
                <span>${isExpanded ? '▲' : '▼'}</span>
              </div>
              <button class="copy-btn" data-action="copy-date" data-date="${date}">📋 Copy Words</button>
            </div>
            <div class="date-group-body ${isExpanded ? '' : 'hidden'}">
              ${wordsInDate.map(item => `
                <div class="history-word-row">
                  <div>
                    <span class="history-word-kor">${item.korean}</span>
                    <span class="history-word-eng">- ${item.english}</span>
                  </div>
                  <div class="action-btn-group">
                    <button class="edit-btn" data-action="edit" data-id="${item.id}">Edit</button>
                    <button class="history-speak-btn" data-action="speak" data-text="${item.korean}">🔊</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function editCustomWordById(id) {
      let targetDeck = decks.custom;
      let item = targetDeck.find(w => String(w.id) === String(id));

      if (!item) {
        targetDeck = decks.memorized;
        item = targetDeck.find(w => String(w.id) === String(id));
      }

      if (!item) return;

      const newKorean = prompt("Edit Korean Word:", item.korean);
      if (newKorean === null) return;

      const newEnglish = prompt("Edit English Translation / Meanings:", item.english);
      if (newEnglish === null) return;

      const trimmedKor = newKorean.trim();
      const trimmedEng = newEnglish.trim();

      if (!trimmedKor) {
        alert("Korean word cannot be empty.");
        return;
      }

      item.korean = trimmedKor;
      item.english = trimmedEng || "Translation unavailable";

      saveWordsToStorage();
      renderCustomList();
      renderDateHistoryTab();

      if (currentDeckKey === 'custom' || currentDeckKey === 'memorized') setDeck(currentDeckKey);
    }

    function deleteCustomWordById(id) {
      const idx = decks.custom.findIndex(w => String(w.id) === String(id));
      if (idx !== -1) {
        decks.custom.splice(idx, 1);
        saveWordsToStorage();
        renderCustomList();
        renderDateHistoryTab();
        if (currentDeckKey === 'custom') setDeck('custom');
      }
    }

    function restoreMemorizedWordById(id) {
      const idx = decks.memorized.findIndex(w => String(w.id) === String(id));
      if (idx !== -1) {
        const restored = decks.memorized.splice(idx, 1)[0];
        decks.custom.unshift(restored);
        saveWordsToStorage();
        renderCustomList();
        renderDateHistoryTab();
        if (currentDeckKey === 'memorized' || currentDeckKey === 'custom') setDeck(currentDeckKey);
      }
    }

    function copyWordsByDate(date, btnElement) {
      const allWords = [...decks.custom, ...decks.memorized];
      const wordsForDate = allWords.filter(w => (w.addedDate || getDisplayDateString()) === date);

      if (wordsForDate.length === 0) return;

      const textToCopy = wordsForDate.map(w => `${w.korean} - ${w.english}`).join('\n');

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "✅ Copied!";
        setTimeout(() => { btnElement.innerText = originalText; }, 1500);
      }).catch(err => { alert("Could not copy words: " + err); });
    }

    document.addEventListener("click", function (e) {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;

      const action = btn.getAttribute("data-action");
      const id = btn.getAttribute("data-id");

      if (action === "edit") editCustomWordById(id);
      else if (action === "delete") deleteCustomWordById(id);
      else if (action === "unmemorize") restoreMemorizedWordById(id);
      else if (action === "speak") {
        const text = btn.getAttribute("data-text");
        if (text) speakKorean(text);
      } else if (action === "toggle-date") {
        const date = btn.getAttribute("data-date");
        dateCollapseState[date] = !dateCollapseState[date];
        renderDateHistoryTab();
      } else if (action === "copy-date") {
        const date = btn.getAttribute("data-date");
        copyWordsByDate(date, btn);
      }
    });

    function markCurrentAsMemorized() {
      if (activeList.length === 0) return;
      const wordObj = activeList[currentIndex];
      
      if (!decks.memorized.some(w => w.korean === wordObj.korean)) decks.memorized.unshift(wordObj);
      if (currentDeckKey === 'custom') {
        const customIndex = decks.custom.findIndex(w => w.korean === wordObj.korean);
        if (customIndex !== -1) decks.custom.splice(customIndex, 1);
      }

      saveWordsToStorage();
      renderCustomList();
      renderDateHistoryTab();

      activeList.splice(currentIndex, 1);
      if (currentIndex >= activeList.length) currentIndex = 0;
      updateCardDisplay();
      resetTimer();
    }

    function shuffleArray(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function resetTimer() {
      if (timer) clearInterval(timer);
      if (isPlaying && activeList.length > 0) {
        timer = setInterval(() => { nextCard(); }, delaySeconds * 1000);
      }
    }

    function setDeck(deckKey) {
      currentDeckKey = deckKey;

      if (orderMode === "random") activeList = shuffleArray(decks[deckKey]);
      else activeList = [...decks[deckKey]];

      currentIndex = 0;
      updateCardDisplay();
      resetTimer();
    }

    function nextCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex + 1) % activeList.length;
      updateCardDisplay();
    }

    function prevCard() {
      if (activeList.length === 0) return;
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      updateCardDisplay();
      resetTimer();
    }

    async function translateKoreanToEnglish(text) {
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
        const data = await response.json();
        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText;
        }
      } catch (err) { console.error("Translation API failed", err); }
      return "";
    }

    folderToggleBtn.addEventListener("click", () => {
      isFolderOpen = !isFolderOpen;
      customWordListContainer.classList.toggle("hidden", !isFolderOpen);
      folderArrow.innerText = isFolderOpen ? "▲" : "▼";
    });

    memorizedToggleBtn.addEventListener("click", () => {
      isMemorizedFolderOpen = !isMemorizedFolderOpen;
      memorizedWordListContainer.classList.toggle("hidden", !isMemorizedFolderOpen);
      memorizedArrow.innerText = isMemorizedFolderOpen ? "▲" : "▼";
    });

    document.getElementById("autoTranslateBtn").addEventListener("click", async () => {
      const kor = document.getElementById("customKorean").value.trim();
      if (!kor) { alert("Please enter a Korean word first."); return; }
      const translateBtn = document.getElementById("autoTranslateBtn");
      translateBtn.innerText = "Translating...";
      const translation = await translateKoreanToEnglish(kor);
      if (translation) document.getElementById("customEnglish").value = translation;
      else alert("Could not translate automatically.");
      translateBtn.innerText = "✨ Auto Translate";
    });

    document.getElementById("deckSelector").addEventListener("click", (e) => {
      if (e.target.classList.contains("segmented-btn")) {
        document.querySelectorAll("#deckSelector .segmented-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        setDeck(e.target.dataset.deck);
      }
    });

    document.getElementById("orderSelector").addEventListener("click", (e) => {
      if (e.target.classList.contains("segmented-btn")) {
        document.querySelectorAll("#orderSelector .segmented-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        orderMode = e.target.dataset.order;
        setDeck(currentDeckKey);
      }
    });

    delaySlider.addEventListener("input", (e) => {
      delaySeconds = parseInt(e.target.value);
      delayValText.innerText = `${delaySeconds} seconds`;
      intervalLabel.innerText = `Interval: ${delaySeconds}s`;
      resetTimer();
    });

    document.getElementById("togglePlayBtn").addEventListener("click", (e) => {
      isPlaying = !isPlaying;
      e.target.innerText = isPlaying ? "❚❚" : "▶";
      if (isPlaying) {
        resetTimer();
        speakKorean(activeList[currentIndex].korean);
      } else if (timer) clearInterval(timer);
    });

    document.getElementById("repeatBtn").addEventListener("click", () => {
      if (activeList.length > 0) speakKorean(activeList[currentIndex].korean);
    });

    document.getElementById("checkBtn").addEventListener("click", () => {
      if (activeList.length === 0) return;
      answerRevealed = !answerRevealed;
      if (answerRevealed) {
        displayWord.innerText = activeList[currentIndex].korean;
        displayHint.innerText = `[ ${activeList[currentIndex].english} ]`;
      } else {
        displayWord.innerText = "????";
        displayHint.innerText = "[ Listen to audio ]";
      }
    });

    document.getElementById("memorizeCurrentBtn").addEventListener("click", () => {
      markCurrentAsMemorized();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      nextCard();
      resetTimer();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      prevCard();
    });

    document.getElementById("addWordBtn").addEventListener("click", async () => {
      const kor = document.getElementById("customKorean").value.trim();
      let eng = document.getElementById("customEnglish").value.trim();
      if (!kor) { alert("Please enter a Korean word."); return; }
      if (!eng) eng = await translateKoreanToEnglish(kor);

      const todayFormatted = getDisplayDateString();
      const existingCustom = decks.custom.find(item => item.korean === kor);
      if (existingCustom) {
        if (confirm(`⚠️ Duplication detected! Append meaning "${eng}"?`)) {
          existingCustom.english += `, ${eng}`;
          saveWordsToStorage();
          renderCustomList();
          renderDateHistoryTab();
          if (currentDeckKey === 'custom') setDeck('custom');
          document.getElementById("customKorean").value = "";
          document.getElementById("customEnglish").value = "";
        }
        return;
      }

      decks.custom.unshift({ 
        id: generateId(),
        korean: kor, 
        english: eng || "Translation unavailable",
        addedDate: todayFormatted 
      });

      saveWordsToStorage();
      renderCustomList();
      renderDateHistoryTab();

      if (currentDeckKey === 'custom') setDeck('custom');

      document.getElementById("customKorean").value = "";
      document.getElementById("customEnglish").value = "";
    });

    // App Initialization
    loadSavedWords();
    loadStreakData();
    renderCustomList();
    updateCardDisplay();
    resetTimer();
  </script>
</body>
</html>
